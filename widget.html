<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KH Floating Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./widget.css" />
</head>
<body>
  <div class="widget-shell" id="widgetShell">
    <div class="widget-glow glow-a"></div>
    <div class="widget-glow glow-b"></div>

    <header class="widget-header" id="dragHandle" title="빈 곳을 잡고 위젯 이동">
      <div>
        <div class="label">FLOATING CALENDAR</div>
        <h1>KH Mission Widget</h1>
      </div>
      <div class="header-actions">
        <button id="hideBtn" class="icon-action" aria-label="위젯 숨기기" title="위젯 숨기기">—</button>
        <button id="settingsBtn" class="icon-action" aria-label="위젯 설정" title="위젯 설정">⚙</button>
        <button id="openFullBtn" class="open-btn">전체 캘린더</button>
      </div>
    </header>

    <section class="hero-card">
      <div class="time-block">
        <div id="clock" class="clock">00:00</div>
        <div id="todayText" class="today-text">TODAY</div>
      </div>
      <div class="next-block">
        <div class="mini-label">NEXT FOCUS</div>
        <strong id="nextTitle">등록된 일정이 없어요.</strong>
        <span id="nextMeta">일정을 추가하면 여기에 표시돼요.</span>
      </div>
    </section>

    <section class="wuwa-motion-panel" id="motionPanel">
      <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZXVjb3J3dnRva2JzODk5M3JmNXExNG15YWkyOTNiM3ViNGttcXd5MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7HPHFMlOgaTDyM6SzS/giphy.gif" alt="명조 워더링 웨이브 GIF" loading="eager" decoding="async">
      <div><b>WUTHERING WAVES</b><span>LOW-MOTION RESONANCE</span></div>
    </section>

    <section class="panel two-col" id="schedulePanel">
      <div class="card" id="todayCard">
        <div class="card-title">오늘 일정</div>
        <div id="todayList" class="list"></div>
      </div>
      <div class="card" id="upcomingCard">
        <div class="card-title">다가오는 일정</div>
        <div id="upcomingList" class="list"></div>
      </div>
    </section>

    <section class="panel calendar-card" id="calendarCard">
      <div class="calendar-head">
        <div>
          <div class="mini-label">MINI MONTH</div>
          <div id="monthTitle" class="month-title">MONTH</div>
        </div>
        <div class="legend">
          <span><i class="dot today"></i> 오늘</span>
          <span><i class="dot event"></i> 일정</span>
        </div>
      </div>
      <div class="weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="miniCalendar" class="mini-calendar"></div>
    </section>

    <footer class="widget-footer">
      <div id="statsText">오늘 0개 · 남은 일정 0개</div>
      <a href="./index.html" target="_blank" rel="noopener">월간 보기 열기</a>
    </footer>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
      <div class="settings-head">
        <div>
          <div class="mini-label">WIDGET SETTINGS</div>
          <h2>내 취향대로</h2>
        </div>
        <button id="closeSettingsBtn" class="icon-action" aria-label="설정 닫기">×</button>
      </div>

      <div class="setting-group">
        <div class="setting-title">테마</div>
        <div class="theme-grid">
          <button class="theme-btn" data-theme="wuwa">Wuwa</button>
          <button class="theme-btn" data-theme="sky">Sky</button>
          <button class="theme-btn" data-theme="midnight">Midnight</button>
          <button class="theme-btn" data-theme="rose">Rose</button>
          <button class="theme-btn" data-theme="mint">Mint</button>
        </div>
      </div>

      <label class="setting-row">
        <span>위젯 투명도 <b id="opacityValue">100%</b></span>
        <input id="opacityRange" type="range" min="20" max="100" step="5" value="100" />
      </label>

      <label class="setting-row">
        <span>글자 크기 <b id="fontValue">100%</b></span>
        <input id="fontRange" type="range" min="85" max="120" step="5" value="100" />
      </label>

      <label class="setting-row">
        <span>블러 강도 <b id="blurValue">18px</b></span>
        <input id="blurRange" type="range" min="0" max="28" step="2" value="18" />
      </label>

      <div class="setting-group">
        <div class="setting-title">창 크기</div>
        <div class="size-grid">
          <button class="size-btn" data-size="small">작게</button>
          <button class="size-btn" data-size="medium">기본</button>
          <button class="size-btn" data-size="large">크게</button>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">Windows</div>
        <label class="toggle-row"><span>로그인 시 자동 실행</span><input id="autoStartToggle" type="checkbox" checked><i></i></label>
      </div>

      <div class="setting-group">
        <div class="setting-title">표시할 내용</div>
        <label class="toggle-row"><span>오늘 일정</span><input id="showTodayToggle" type="checkbox" checked><i></i></label>
        <label class="toggle-row"><span>다가오는 일정</span><input id="showUpcomingToggle" type="checkbox" checked><i></i></label>
        <label class="toggle-row"><span>미니 달력</span><input id="showCalendarToggle" type="checkbox" checked><i></i></label>
        <label class="toggle-row"><span>달력만 보기</span><input id="calendarOnlyToggle" type="checkbox"><i></i></label>
        <label class="toggle-row"><span>명조 GIF</span><input id="showMotionToggle" type="checkbox" checked><i></i></label>
      </div>

      <label class="setting-select">
        <span>일정 자동 반영</span>
        <select id="refreshSelect">
          <option value="5">5분마다</option>
          <option value="10">10분마다</option>
          <option value="30">30분마다</option>
          <option value="0">자동 새로고침 끄기</option>
        </select>
      </label>

      <div class="settings-note">
        위젯 설정은 이 PC에 저장돼요. 일정 데이터는 GitHub 캘린더와 계속 연결됩니다.
      </div>

      <button id="resetSettingsBtn" class="reset-btn">설정 초기화</button>
    </aside>
    <div id="settingsBackdrop" class="settings-backdrop"></div>
  </div>

  <script src="./events-data.js"></script>
  <script src="./widget.js"></script>
</body>
</html>
